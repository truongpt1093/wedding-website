<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiệp Cưới Online</title>
  <meta name="description" content="Trân trọng kính mời bạn đến dự lễ thành hôn của chúng tôi.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Thiệp Cưới Online">
  <meta property="og:description" content="Trân trọng kính mời bạn đến dự lễ thành hôn của chúng tôi.">
  <meta property="og:image" content="img/hero-min.jpg">

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
  
  <!-- LIBRARIES -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fancybox/3.5.7/jquery.fancybox.min.css">

  <style>
    :root {
      --gold: #b89c6d;
      --gold-light: #f4ede1;
      --gold-dark: #8c764e;
      --cream: #faf9f6;
      --dark: #121212;
      --text: #2a2a2a;
      --text-light: #6a6a6a;
      --rose: #e4c1c1;
      --sage: #a7b8a8;
      --font-serif: 'Playfair Display', serif;
      --font-script: 'Great Vibes', cursive;
      --font-sans: 'Inter', sans-serif;
      --transition-soft: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html.lenis { height: auto; }
    .lenis.lenis-smooth { scroll-behavior: auto !important; }
    .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
    .lenis.lenis-stopped { overflow: hidden; }

    body { 
      font-family: var(--font-sans); 
      background: var(--cream); 
      color: var(--text); 
      overflow-x: hidden; 
      -webkit-font-smoothing: antialiased; 
    }
    
    h1, h2, h3, h4 { font-family: var(--font-serif); font-weight: 400; letter-spacing: -0.02em; }
    p { line-height: 1.8; font-weight: 300; font-size: 0.95rem; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 40px; }
    section { padding: 120px 0; }
    .text-center { text-align: center; }

    /* LOADING SCREEN */
    #loading-screen {
      position: fixed; inset: 0; background: var(--cream); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 1s var(--transition-soft), visibility 1s var(--transition-soft);
    }
    #loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loading-text { font-family: var(--font-serif); font-size: 1.1rem; color: var(--gold-dark); letter-spacing: 0.3em; text-transform: uppercase; }

    /* NAVIGATION */
    nav {
      position: fixed; top: 0; width: 100%; z-index: 900;
      padding: 32px 40px; display: flex; align-items: center; justify-content: space-between;
      transition: var(--transition-soft);
    }
    nav.scrolled { padding: 20px 40px; background: rgba(250, 249, 246, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(184, 156, 109, 0.1); }
    .nav-logo { font-family: var(--font-serif); font-size: 1.5rem; color: var(--dark); text-decoration: none; letter-spacing: 0.1em; }
    .nav-links { display: flex; gap: 40px; list-style: none; }
    .nav-links a { color: var(--text-light); text-decoration: none; font-size: 0.7rem; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; transition: var(--transition-soft); }
    .nav-links a:hover { color: var(--gold); }
    .nav-rsvp { padding: 10px 24px !important; border: 1px solid var(--gold); color: var(--gold) !important; border-radius: 100px; }

    /* HERO SECTION */
    #hero { height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: var(--cream); }
    .hero-content { position: relative; z-index: 2; text-align: center; max-width: 900px; }
    .hero-subtitle { font-size: 0.75rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold-dark); margin-bottom: 40px; font-weight: 500; }
    .hero-names { font-size: clamp(4rem, 15vw, 10rem); line-height: 0.85; margin-bottom: 40px; color: var(--dark); }
    .hero-date { font-family: var(--font-sans); font-size: 0.8rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold-dark); font-weight: 500; }
    .hero-bg { position: absolute; inset: 0; background-position: center; background-size: cover; opacity: 0.15; filter: grayscale(1); }

    /* STORY - ASYMMETRIC EDITORIAL */
    .story-item { display: grid; grid-template-columns: repeat(12, 1fr); gap: 40px; align-items: center; margin-bottom: 160px; }
    .story-image { grid-column: 1 / 8; position: relative; overflow: hidden; }
    .story-image img { width: 100%; aspect-ratio: 16/10; object-fit: cover; transition: transform 2s var(--transition-soft); }
    .story-item:nth-child(even) .story-image { grid-column: 5 / 13; }
    .story-content { grid-column: 9 / 13; padding-left: 20px; }
    .story-item:nth-child(even) .story-content { grid-column: 1 / 5; grid-row: 1; padding-left: 0; padding-right: 20px; text-align: right; }
    .story-year { font-size: 5rem; color: var(--gold-light); line-height: 1; margin-bottom: 20px; font-family: var(--font-serif); }
    .story-title { font-size: 2rem; margin-bottom: 24px; color: var(--dark); }
    .story-text { color: var(--text-light); }

    /* EVENT CARDS - SOFT AESTHETIC */
    .events-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 32px; margin-top: 60px; }
    .event-card { background: white; padding: 80px 48px; text-align: center; border: 1px solid rgba(184, 156, 109, 0.1); transition: var(--transition-soft); }
    .event-card:hover { transform: translateY(-10px); border-color: var(--gold); }
    .event-card h3 { font-size: 2.2rem; margin-bottom: 24px; color: var(--dark); }
    .event-info { font-size: 0.85rem; letter-spacing: 0.1em; color: var(--gold-dark); text-transform: uppercase; margin-bottom: 8px; font-weight: 600; }

    /* GALLERY */
    .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 80px; }
    .gallery-item { aspect-ratio: 1; overflow: hidden; position: relative; }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.5s var(--transition-soft); }
    .gallery-item:hover img { transform: scale(1.08); }

    /* BUTTONS */
    .btn-gold {
      display: inline-block; padding: 20px 52px; background: var(--dark); color: white;
      text-decoration: none; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.25em;
      text-transform: uppercase; border-radius: 100px; transition: var(--transition-soft);
    }
    .btn-gold:hover { background: var(--gold); transform: translateY(-4px); box-shadow: 0 20px 40px rgba(184, 156, 109, 0.2); }

    /* RSVP FORM */
    .rsvp-wrapper { max-width: 600px; margin: 80px auto 0; }
    .form-group { margin-bottom: 32px; text-align: left; }
    .form-group label { display: block; font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-light); margin-bottom: 12px; font-weight: 600; }
    .form-group input, .form-group select {
      width: 100%; padding: 18px 0; background: transparent; border: none; border-bottom: 1px solid rgba(184, 156, 109, 0.3);
      font-size: 1.1rem; font-family: var(--font-serif); color: var(--dark); outline: none; transition: var(--transition-soft);
    }
    .form-group input:focus { border-bottom-color: var(--gold); }

    footer { padding: 80px 0; background: var(--cream); border-top: 1px solid rgba(184, 156, 109, 0.1); text-align: center; }
    .footer-names { font-family: var(--font-script); font-size: 3rem; color: var(--gold); margin-bottom: 16px; }

    @media (max-width: 768px) {
      .story-item { display: block; margin-bottom: 80px; }
      .story-image { margin-bottom: 32px; }
      .story-content { padding-left: 0; text-align: left !important; }
      .hero-names { font-size: 5rem; }
      .container { padding: 0 24px; }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
      nav { padding: 24px; }
    }
  </style>
</head>
<body>

<div id="loading-screen">
  <div class="loading-text">Mở thiệp cưới</div>
</div>

<nav id="main-nav">
  <a href="#hero" class="nav-logo" id="nav-logo">A & K</a>
  <ul class="nav-links">
    <li><a href="#story">Chuyện Tình</a></li>
    <li><a href="#events">Sự Kiện</a></li>
    <li><a href="#gallery">Kỷ Niệm</a></li>
    <li><a href="#rsvp" class="nav-rsvp">RSVP</a></li>
  </ul>
</nav>

<section id="hero">
  <div class="hero-bg" id="hero-bg"></div>
  <div class="hero-content">
    <p class="hero-subtitle">Trân trọng kính mời</p>
    <h1 class="hero-names">
      <span id="bride-name"></span><br>
      <span style="font-family: var(--font-script); font-size: 0.5em; color: var(--gold);">&</span><br>
      <span id="groom-name"></span>
    </h1>
    <p class="hero-date" id="hero-date"></p>
  </div>
</section>

<section id="story">
  <div class="container">
    <div class="text-center" style="margin-bottom: 100px;">
      <p class="hero-subtitle" style="margin-bottom: 16px;">Hành trình</p>
      <h2 style="font-size: 3.5rem;">Chuyện Tình Yêu</h2>
    </div>
    <div id="story-grid"></div>
  </div>
</section>

<section id="events" style="background: white;">
  <div class="container">
    <div class="text-center">
      <p class="hero-subtitle" style="margin-bottom: 16px;">Lịch trình</p>
      <h2 style="font-size: 3.5rem;">Sự Kiện</h2>
    </div>
    <div class="events-grid" id="events-grid"></div>
  </div>
</section>

<section id="gallery">
  <div class="container text-center">
    <p class="hero-subtitle" style="margin-bottom: 16px;">Khoảnh khắc</p>
    <h2 style="font-size: 3.5rem;">Ảnh Kỷ Niệm</h2>
    <div class="gallery-grid" id="gallery-grid"></div>
  </div>
</section>

<section id="rsvp">
  <div class="container text-center">
    <p class="hero-subtitle" style="margin-bottom: 16px;">Gửi lời chúc</p>
    <h2 style="font-size: 3.5rem;">Xác Nhận Tham Dự</h2>
    <div class="rsvp-wrapper">
      <div class="form-group">
        <label>Họ và Tên</label>
        <input type="text" id="rsvp-name" placeholder="Tên của bạn">
      </div>
      <div class="form-group">
        <label>Số điện thoại</label>
        <input type="tel" id="rsvp-phone" placeholder="090...">
      </div>
      <div class="form-group">
        <label>Tham dự</label>
        <select id="rsvp-attend">
          <option value="yes">Tôi sẽ tham dự</option>
          <option value="no">Rất tiếc, tôi không thể</option>
        </select>
      </div>
      <button class="btn-gold" id="rsvp-submit" style="width: 100%; margin-top: 40px;">Gửi Xác Nhận</button>
      <div id="rsvp-message" style="margin-top: 24px;"></div>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="footer-names" id="footer-names"></div>
    <p style="letter-spacing: 0.2em; text-transform: uppercase; font-size: 0.7rem; color: var(--text-light);" id="footer-message"></p>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.0.45/dist/lenis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fancybox/3.5.7/jquery.fancybox.min.js"></script>

<script>
(async function() {
  const lenis = new Lenis();
  function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
  requestAnimationFrame(raf);

  let config;
  try {
    const res = await fetch('config.json?v=' + Date.now());
    config = await res.json();
  } catch(e) {
    document.getElementById('loading-screen').style.display = 'none';
    return;
  }

  const {bride, groom} = config.couple;
  document.getElementById('bride-name').textContent = bride.name;
  document.getElementById('groom-name').textContent = groom.name;
  document.getElementById('hero-date').textContent = config.wedding.dateDisplay;
  document.getElementById('nav-logo').textContent = bride.name[0] + ' & ' + groom.name[0];
  document.getElementById('footer-names').textContent = bride.name + ' & ' + groom.name;
  document.getElementById('footer-message').textContent = config.footer.message;

  const sg = document.getElementById('story-grid');
  config.story.forEach((item, i) => {
    sg.innerHTML += `
      <div class="story-item gsap-reveal">
        <div class="story-image">
          <img src="${item.image || 'img/eng_pics/1.jpg'}" alt="${item.title}">
        </div>
        <div class="story-content">
          <div class="story-year">${item.year}</div>
          <h3 class="story-title">${item.title}</h3>
          <p class="story-text">${item.content}</p>
        </div>
      </div>
    `;
  });

  const eg = document.getElementById('events-grid');
  config.events.forEach((ev, i) => {
    eg.innerHTML += `
      <div class="event-card gsap-reveal">
        <div class="event-info">${ev.date} — ${ev.time}</div>
        <h3>${ev.name}</h3>
        <p style="margin-bottom: 24px;">${ev.address}</p>
        <a href="${config.venue.googleMapsUrl}" target="_blank" class="btn-gold" style="padding: 12px 32px; font-size: 0.6rem;">Bản đồ</a>
      </div>`;
  });

  const gg = document.getElementById('gallery-grid');
  config.gallery.forEach((img, i) => {
    gg.innerHTML += `
      <div class="gallery-item gsap-reveal">
        <a data-fancybox="gallery" href="${img.fullSrc}">
          <img src="${img.src}" alt="${img.alt}">
        </a>
      </div>`;
  });

  gsap.registerPlugin(ScrollTrigger);
  
  // Hero Entrance
  gsap.from(".hero-names span", { y: 100, opacity: 0, duration: 2, stagger: 0.2, ease: "expo.out" });
  gsap.from(".hero-subtitle, .hero-date", { opacity: 0, duration: 2, delay: 0.5 });
  
  // Scroll Reveals
  gsap.utils.toArray(".gsap-reveal").forEach(el => {
    gsap.from(el, {
      y: 50, opacity: 0, duration: 1.2, ease: "power3.out",
      scrollTrigger: { trigger: el, start: "top 90%" }
    });
  });

  setTimeout(() => {
    document.getElementById('loading-screen').classList.add('hidden');
  }, 1000);

  window.addEventListener('scroll', () => {
    document.getElementById('main-nav').classList.toggle('scrolled', window.scrollY > 100);
  });

  // RSVP Submit (Simplified for now)
  document.getElementById('rsvp-submit').addEventListener('click', () => {
    const msg = document.getElementById('rsvp-message');
    msg.innerHTML = "Cảm ơn bạn đã xác nhận!";
    msg.style.color = "var(--gold)";
  });

  $('[data-fancybox="gallery"]').fancybox({buttons: ['zoom','close'], loop: true});
})();
</script>
</body>
</html>
